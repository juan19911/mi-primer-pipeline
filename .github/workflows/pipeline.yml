name: Enumeracion GITHUB_TOKEN

on: [push]

jobs:
  enum:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Ver permisos del token
        run: |
          echo "Consultando info del token..."
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }} \
            | python3 -m json.tool

      - name: Ver a que repos tiene acceso
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/installation/repositories \
            | python3 -m json.tool

      - name: Intentar listar secrets del repo
        run: |
          curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/secrets
