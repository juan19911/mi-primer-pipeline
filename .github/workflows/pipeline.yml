name: Enumeracion del servidor

on: [push]

jobs:
  enum:
    runs-on: ubuntu-latest
    env:
      MI_PASSWORD: ${{ secrets.MI_PASSWORD }}
    steps:
      - name: Bajar el codigo
        uses: actions/checkout@v4

      - name: Ver todas las variables de entorno
        run: env

      - name: Ver usuario y permisos
        run: |
          whoami
          id

      - name: Ver el sistema operativo
        run: |
          uname -a
          cat /etc/os-release

      - name: Ver procesos corriendo
        run: ps aux

      - name: Ver archivos en el sistema
        run: |
          ls /
          ls /home
          ls /tmp

      - name: Ver conectividad a internet
        run: |
          curl -s https://ifconfig.me
